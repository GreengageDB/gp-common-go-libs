version: "2"

linters:
  # Enable only the linters listed below.
  default: none
  enable:
    - errcheck
    - govet
    - revive
    - unparam
    - unused
  settings:
    revive:
      # Configuring a rule below would otherwise replace the default rule set
      # instead of extending it.
      enable-default-rules: true
      rules:
        - name: dot-imports
          # The test framework is meant to be dot imported. Dot imports of any
          # other package are still reported, including in the test helpers of
          # structmatcher and testhelper, which are not _test.go files.
          arguments:
            - allowedPackages:
                - github.com/onsi/ginkgo/v2
                - github.com/onsi/gomega
  exclusions:
    generated: lax
    # The issues that golangci-lint v1 excluded by default.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
      # The external test package of conv dot imports the package it tests.
      - path: ^conv/.+_test\.go$
        text: should not use dot imports
        linters:
          - revive
