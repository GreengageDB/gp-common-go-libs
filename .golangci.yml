version: "2"

linters:
  # Enable only the linters listed below.
  default: none
  enable:
    - errcheck
    - govet
    - revive
    - unparam
    - unused
  exclusions:
    generated: lax
    # The issues that golangci-lint v1 excluded by default.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: (.+)\.go$
        text: don't use ALL_CAPS in Go names; use CamelCase
      - path: (.+)\.go$
        text: should not use dot imports
    paths:
      - third_party$
      - builtin$
      - examples$
